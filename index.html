 for(const [k,v]of Object.entries(raw.qstats||{})){if(Object.hasOwn(qMap,k)&&v&&typeof v==='object')o.qstats[k]={attempts:Math.floor(num(v.attempts)),correct:Math.floor(num(v.correct)),last:num(v.last,0,9e15)}}

}

<section class="daily"><div class="goal-ring" style="--progress:${Math.min(d.attempts/state.dailyGoal*100,100)}%"><span>${d.attempts>=state.dailyGoal?'✓':'🎯'}</span></div><div><h3>${d.attempts>=state.dailyGoal?'Щоденну ціль виконано!':state.dailyGoal+' відповідей — маленька перемога'}</h3><p class="muted">${d.attempts} / ${state.dailyGoal} відповідей сьогодні</p></div></section><button class="primary full gap" data-action="open-module" data-id="${next.id}">${count?'Продовжити навчання':'Почати урок'} →</button>
<div class="section-head spread"><h2>Твій навчальний шлях</h2><span class="tiny-pill">${count} / ${TOTAL_MODULES}</span></div><div class="progress-line" aria-label="Пройдено ${count} з ${TOTAL_MODULES} тем"><span style="width:${count/TOTAL_MODULES*100}%"></span></div>
<div class="module-list gap">${DATA.modules.map(m=>`<button class="module ${(state.best[m.id]||0)>=80?'done':''}" data-action="open-module" data-id="${m.id}"><span class="module-icon">${(state.best[m.id]||0)>=80?'✅':m.icon}</span><span><span class="mini">Блок ${m.id} · ${e(m.lt)}</span><h3>${e(m.title)}</h3><p>${e(m.desc)}</p>${state.best[m.id]!==undefined?`<p class="positive">Найкраща серія: ${state.best[m.id]}%</p>`:''}</span><span class="chevron">›</span></button>`).join('')}</div>
<section class="card gap"><div class="row"><span style="font-size:32px">🏆</span><div><h3>Готові поєднати все?</h3><p class="muted small">${TOTAL_MODULES*3} завдань з усіх ${TOTAL_MODULES} тем</p></div></div><button class="secondary full" data-action="start" data-id="final">Підсумковий тест</button></section><p class="help-footer">Усі блоки відкриті. Навчайтеся у своєму темпі.</p>`}
function table(headers,items){return`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${items.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function example(a,b){return`<div class="example"><strong lang="lt">${a}</strong><span class="muted">${b}</span></div>`}
function dictionary(items){return items.map(c=>`<div class="dictionary-row"><span style="font-size:25px">${c.icon}</span><div class="word"><strong lang="lt">${e(c.n)}</strong><p class="muted">${e(c.u)}</p></div><button class="icon-button" aria-label="Озвучити ${e(c.n)}" data-action="speak-card" data-id="${c.id}">♪</button></div>`).join('')}
function learnContent(id){switch(id){
case 1:return `<p>Повторіть назви відмінків. У цьому уроці найбільше працюємо з родовим, знахідним і місцевим; наприкінці — зі звертанням.</p>${table(['Відмінок','Питання / функція','Приклад'],DATA.cases.map(c=>[lt(c.n)+'<br>'+e(c.u),lt(c.question),lt(c.example)+'<br>'+e(c.translation)]))}<div class="info-box"><b>Кличний</b> використовується у звертанні й не має звичайного відмінкового питання. Позначення Kas! на слайді — навчальна підказка, а не питання до форми.</div><h3>Три знайомі прийменники</h3>${table(['Значення','Конструкція','Зразок'],[['До місця / на подію','į + знахідний',lt('į universitetą, į susitikimą')],['До / у людини','pas + знахідний',lt('pas draugą, pas tėvus')],['Біля / коло','prie + родовий',lt('prie parko, prie jūros')]])}${example('Sėdime prie stalo. Dirbu prie kompiuterio.','Сидимо за столом. Працюю за комп’ютером. Prie тут також передає близькість до об’єкта.')}<p>Тренування містить усі 21 речення зі слайда 5 та форми після <span lang="lt">prie</span> зі слайда 4.</p><details><summary>Слова місць з уроку</summary><div>${dictionary(DATA.places)}</div></details>`;
case 2:return `<p>У словниковому записі наведено три основні форми: <b>неозначена форма, третя особа теперішнього часу, третя особа минулого часу</b>.</p>${example('eiti, eina, ėjo','Іти · він / вона йде · він ішов / вона йшла. У вправах насамперед відмінюємо теперішній час.')}<div class="note"><b lang="lt">Eiti</b> — іти пішки; <b lang="lt">važiuoti</b> — їхати транспортом. Саме дієслово važiuoti не визначає, чи це автобус, автомобіль або поїзд.</div>${DATA.verbs.map(v=>`<details ${v.n==='eiti'?'open':''}><summary>${lt(v.n)} — ${e(v.u)} ${v.review?'· повторення':''}</summary><div><p class="small muted" lang="lt">${e(v.n)}, ${e(v.present[2])}, ${e(v.past)}</p>${table(['Хто?','Теперішній час'],DATA.pronouns.map((p,i)=>[lt(p),lt(v.present[i])]))}</div></details>`).join('')}<div class="info-box">Форма для <b lang="lt">jis / ji</b> і <b lang="lt">jie / jos</b> однакова: <span lang="lt">jis eina, jie eina</span>. Займенник показує, про кого говоримо.</div><h3>Зверніть увагу</h3>${example('Aš skubu. Tu skubi. Mes skubame.','У skubėti теперішня основа skub-, без -ė-.')}${example('Aš susitinku. Mes susitinkame.','У слові susitikti є зворотний елемент -si-. Вчіть ці форми повністю.')}<button class="secondary full gap" data-action="training" data-id="verbs">Відкрити таблицю дієслів</button>`;
case 3:return `<h3>Чотири пори року</h3>${table(['Назва','Українською','Коли?'],DATA.timewords.filter(c=>c.group==='season').map(c=>[c.icon+' '+lt(c.n),e(c.u),lt(c.a)]))}<h3>Дні тижня</h3>${table(['Назва дня','Коли?','Українською'],DATA.timewords.filter(c=>['weekday','weekend'].includes(c.group)).map(c=>[lt(c.n),lt(c.a),e(c.u)]))}${example('Šiandien yra pirmadienis. Susitinkame pirmadienį.','Сьогодні понеділок. Зустрічаємося в понеділок. Назва дня й відповідь на «коли?» мають різні форми.')}<div class="info-box">Назви днів тижня та пір року всередині речення зазвичай пишуться з малої літери. На початку речення — з великої. У вправах регістр не впливає на оцінку.</div><h3>Маленька послідовність</h3><p lang="lt">pirmadienis → antradienis → trečiadienis → ketvirtadienis → penktadienis → šeštadienis → sekmadienis</p><button class="secondary full gap" data-action="training" data-id="planner">Скласти фразу для мого тижня</button>`;
case 4:return `<h3>Частини доби</h3>${table(['Назва','Українською','Коли?'],DATA.timewords.filter(c=>c.group==='daypart').map(c=>[c.icon+' '+lt(c.n),e(c.u),lt(c.n==='vakaras'?'vakare':c.a)]))}<div class="note"><b lang="lt">Vakar</b> — учора; <b lang="lt">vakaras</b> — вечір; <b lang="lt">vakare</b> — увечері. Це не взаємозамінні слова.</div>${example('Vakar aš dirbau. Šiandien vakare skambinu mamai.','Учора я працював / працювала. Сьогодні ввечері телефоную мамі. Dirbau — додаткова форма «я працював / працювала».')}<h3>Прислівники часу</h3>${dictionary(DATA.adverbs)}<h3>Ніколи — із запереченням</h3>${example('Aš niekada nevėluoju. Jis niekada nedirba vakare.','Я ніколи не запізнююся. Він ніколи не працює ввечері. Після niekada у цих реченнях потрібне ne- у дієслові.')}<div class="info-box">У вправі зі слайда 18 деякі пропуски допускають кілька прислівників. У застосунку додано українське значення, щоб відповідь була однозначною: «іноді» → kartais, «зараз» → dabar.</div><p><span lang="lt">Greitai</span> залежно від контексту означає «скоро» або «швидко». <span lang="lt">Kasdien</span> — «щодня».</p>`;
case 5:return `<p>На питання <b lang="lt">Kada?</b> — «Коли?» — часто відповідаємо іменником у <b>знахідному відмінку без прийменника</b>. Не додавайте українське «у» автоматично як į.</p>${example('Kada susitinkame? — Antradienį vakare.','Коли зустрічаємося? — У вівторок увечері.')}${table(['Назва','Коли?','Значення'],DATA.timewords.map(c=>[lt(c.n),lt(c.n==='vakaras'?'vakare':c.a),e(c.when)]))}<div class="note"><b lang="lt">Ruduo → rudenį</b>: змінюється основа. <b lang="lt">Naktis → naktį</b>. У словах днів тижня пишемо кінцеве <b>-į</b>: <span lang="lt">pirmadienį, antradienį</span>.</div><h3>Rytą / ryte та vakare</h3><p>І <span lang="lt">rytą</span>, і <span lang="lt">ryte</span> означають «уранці» та є правильними. У вільній відповіді на «коли?» застосунок приймає обидві форми. Якщо завдання просить <b>саме знахідний</b>, потрібне <span lang="lt">rytą</span>.</p><p>Для «увечері» в уроці вчимо звичне <span lang="lt">vakare</span>. Сам знахідний однини слова <span lang="lt">vakaras</span> — <span lang="lt">vakarą</span>, наприклад у сполученні <span lang="lt">šį vakarą</span> — «цього вечора».</p>${example('Rytoj rytą einu į universitetą.','Завтра вранці йду до університету. Теперішня форма з rytoj у цьому контексті передає заплановану дію.')}<h3>Час і місце — поруч</h3>${example('Sekmadienį susitinkame prie kavinės.','У неділю зустрічаємося біля кафе. Sekmadienį — час, kavinės — родовий після prie.')}<button class="secondary full gap" data-action="training" data-id="planner">Скласти власну фразу часу</button>`;
case 6:return `<p>У сполучених назвах залежна частина часто стоїть у родовому відмінку: <span lang="lt">Vilnius → Vilniaus universitetas</span>. При зміні відмінка всієї назви ця частина залишається незмінною.</p>${example('Vilniaus universitetas → į Vilniaus universitetą → Vilniaus universitete','Назва → до університету → в університеті. Змінюємо universitetas, а Vilniaus зберігаємо.')}${table(['Частини назви','Початкова назва','Де?'],DATA.named.map(c=>[lt(c.base),lt(c.n),lt(c.l)]))}<div class="info-box">Порівняйте: <span lang="lt">į Gedimino pilį</span> — у замок; <span lang="lt">prie Gedimino pilies</span> — біля замку; <span lang="lt">Gedimino pilyje</span> — у замку. Частина <b>Gedimino</b> однакова.</div><h3>Приклади зі слайдів 23–24</h3>${example('Gyvenu Kauno senamiestyje. Dirbu Vilniaus universitete.','Живу у старому місті Каунаса. Працюю у Вільнюському університеті.')}${example('Einu į Švedijos ambasadą. Gyvenu prie Švedijos ambasados.','Іду до посольства Швеції. Живу біля посольства Швеції.')}<button class="secondary full gap" data-action="training" data-id="forms">Порівняти всі чотири форми</button>`;
case 7:return `<h3>Звідки — куди?</h3>${table(['Питання','Конструкція','Приклад'],[['Iš kur? · Звідки?','iš + родовий',lt('iš Vilniaus')],['Kur? · Куди?','į + знахідний',lt('į Alytų')],['Pas ką? · До кого?','pas + знахідний',lt('pas draugą')],['Kur? · Де?','місцевий',lt('Vilniuje')]])}${example('Jūs važiuojate iš Vilniaus į Alytų.','Ви їдете з Вільнюса до Алітуса.')}<details open><summary>Усі маршрути зі слайда 25</summary><div>${DATA.driving.map(r=>`<p lang="lt">${e(r.sentence)}</p>`).join('')}</div></details><h3>Einu į … / einu pas …</h3>${table(['Хто?','До місця','До людини'],DATA.walking.map(r=>{const p=byN[r.place],v=byN[r.visitor],f=DATA.verbs.find(v=>v.n==='eiti').present[r.person];return[lt(r.sub+' '+f),lt('į '+p.a),lt('pas '+v.a)]}))}<h3>Gyvenu … / gyvenu pas …</h3>${table(['Хто?','Де живе?','У кого?'],DATA.living.map(r=>{const c=byN[r.city],p=byN[r.visitor],f=DATA.verbs.find(v=>v.n==='gyventi').present[r.person];return[lt(r.sub+' '+f),lt(c.l),lt('pas '+p.a)]}))}<div class="note"><span lang="lt">Einu pas draugą</span> — іду до друга; <span lang="lt">gyvenu pas draugą</span> — живу у друга. Після pas залишається знахідний.</div><button class="secondary full gap" data-action="training" data-id="route">Побудувати свій маршрут</button>`;
case 8:return `<p><b lang="lt">Šauksmininkas</b> — кличний відмінок. Коли звертаємося до людини, використовуємо спеціальну форму її імені або назви.</p>${table(['Називаємо','Звертаємося'],DATA.vocatives.map(c=>[lt(c.n),lt(c.voc+'!')]))}<h3>Поширені зразки зі слайда 29</h3>${table(['Тип','Зміна','Приклад'],[['Загальні назви на -as','-e',lt('ponas → pone')],['Чоловічі імена на -as','-ai',lt('Vytautas → Vytautai')],['-is / -ys','-i / -y',lt('Jurgis → Jurgi; Balys → Baly')],['-ė','-e',lt('Eglė → Egle')],['-ius','-iau',lt('Audrius → Audriau')],['-tojas','-tojau',lt('dėstytojas → dėstytojau')],['-ėjas','-ėjau',lt('padavėjas → padavėjau')],['-ukas','-uk',lt('berniukas → berniuk')]])}<p class="small muted">Це навчальні моделі для слів цього уроку. Закінчення та наголос інших назв можуть відрізнятися; вчіть знайомі звертання цілком.</p>${example('Pone, atsiprašau! Jurgi, kada susitinkame?','Пане, перепрошую! Юргісе, коли зустрічаємося?')}${example('Egle, kur tu esi? Dėstytojau, atsiprašau!','Егле, де ти? Викладачу, перепрошую!')}<div class="info-box">Звертання відокремлюється комою: <span lang="lt">Jurgi, …</span>. У <span lang="lt">Rasa → Rasa</span> написання не змінюється.</div>`;
case 9:return `<p>Поєднайте всі теми: час, дієслово, місце й звертання. Діалоги нижче — навчальні тексти, створені за конструкціями вашого PDF.</p>${DATA.dialogs.map((d,i)=>`<section class="card gap"><span class="pill">Діалог ${i+1}</span><h3 class="gap">${e(d.title)}</h3><p class="small muted">${e(d.label)}</p>${d.lines.map(line=>`<div class="dialog-line"><p lang="lt">${e(line[0])}</p><p class="translation-line">${e(line[1])}</p></div>`).join('')}<button class="secondary full" data-action="dialog" data-id="${i}">Послухати й перевірити розуміння</button></section>`).join('')}<div class="info-box gap">Відповідайте за текстом: якщо годину або транспорт не названо, це не можна визначити лише з дієслова руху.</div><button class="primary full gap" data-action="training" data-id="planner">Скласти власний план дня</button><button class="outline full gap" data-action="start" data-id="build">Скласти речення зі слів</button>`;
}}
function moduleScreen(){const m=moduleFor(currentModule);const bank=DATA.questions.filter(q=>q.m===m.id),practiced=bank.filter(q=>state.qstats[q.id]).length;return`<div class="screen-title row"><button class="back" data-action="nav" data-id="home" aria-label="До уроку">‹</button><div><div class="eyebrow">Блок ${m.id} / ${TOTAL_MODULES}</div><h1>${m.title}</h1></div></div><div class="spread"><span class="pill" lang="lt">${e(m.lt)}</span><span class="muted small">${practiced} / ${bank.length} спробувано</span></div><div class="tabs" role="tablist"><button class="tab ${moduleTab==='learn'?'active':''}" data-action="module-tab" data-id="learn" role="tab" aria-selected="${moduleTab==='learn'}">Пояснення</button><button class="tab ${moduleTab==='practice'?'active':''}" data-action="module-tab" data-id="practice" role="tab" aria-selected="${moduleTab==='practice'}">Тренування</button></div>${moduleTab==='learn'?`<div class="lesson-body">${learnContent(m.id)}</div><p class="help-footer">Матеріал PDF: слайди ${e(m.pages)}.</p><button class="primary full gap" data-action="start" data-id="module">Закріпити практикою →</button>`:`<div class="card"><div style="font-size:45px">${m.icon}</div><h2 class="gap">Коротка серія</h2><p class="muted gap">12 завдань із теми з поясненням кожної відповіді. Помилки повернуться наприкінці для закріплення.</p><button class="primary full" data-action="start" data-id="module">Почати тренування</button></div><div class="info-box gap">Для зарахування блоку потрібно щонайменше 80% правильних відповідей з першої спроби в серії. Усі вправи залишаються доступними.</div>${state.best[m.id]!==undefined?`<p class="muted small gap">Найкраща серія: ${state.best[m.id]}%.</p>`:''}`}`}
function beginCards(){flashDeck=rnd(DATA.cards.filter(c=>flashCat==='Усі'||c.cat===flashCat));flashIndex=0;flashFlipped=false;flashRated=0}

✓</button></div><button class="chip full gap" data-action="skip-card">Пропустити без оцінки →</button><p class="help-footer">«Ще вчу» → через 10 хв; «Пам’ятаю» → 1, 3, 7, 14, 30 днів.</p>`}
return`<div class="screen-title"><div class="eyebrow">Слова, які залишаються з тобою</div><h1>Картки та словник</h1><p class="muted small" style="margin-top:8px">${DATA.cards.length} карток · зі зразками та озвученням</p></div><div class="tabs"><button class="tab ${!dictMode?'active':''}" data-action="card-mode" data-id="flash">Картки</button><button class="tab ${dictMode?'active':''}" data-action="card-mode" data-id="dict">Словник</button></div><div class="filters">${cats.map(c=>`<button class="chip ${flashCat===c?'active':''}" data-action="card-cat" data-id="${c}">${c}</button>`).join('')}</div>${body}`}
function cardForms(c){const fields=[...(c.forms||[])];if(c.a&&!fields.some(f=>f[1]===c.a))fields.push([c.cat==='Люди'?'До / у людини':'Знахідний',c.cat==='Люди'?'pas '+c.a:c.a]);if(c.g)fields.push(['prie / iš + родовий',c.g]);if(c.l)fields.push(['Місцевий · де?',c.l]);if(c.voc&&!fields.some(f=>f[1]===c.voc+'!'))fields.push(['Звертання',c.voc+'!']);return fields.length?`<div class="form-grid">${fields.map(([k,v])=>`<div><small>${e(k)}</small><strong lang="lt">${e(v)}</strong></div>`).join('')}</div>`:''}
function scheduleCard(id,known){const old=state.srs[id]||{step:0,seen:0};const sameDay=known&&old.step>0&&old.last&&localDay(new Date(old.last))===localDay();const step=known?(sameDay?old.step:Math.min(old.step+1,5)):0;const intervals=[10*60000,DAY,3*DAY,7*DAY,14*DAY,30*DAY];state.srs[id]={step,due:sameDay?old.due:Date.now()+intervals[step],seen:old.seen+1,last:Date.now()}}
function rateCard(known){if(!flashFlipped||flashIndex>=flashDeck.length)return;const c=flashDeck[flashIndex];scheduleCard(c.id,known);touch(known,known?5:1);flashRated++;flashIndex++;flashFlipped=false;render()}
function trainScreen(){const opts=[['mix','⚡','Швидке тренування','12 завдань із різних тем'],['prepositions','🧭','Į, pas, prie','Усі 21 речення зі слайда та відмінки'],['verbs','🚶','Таблиці дієслів','9 дієслів · усі особи теперішнього часу'],['timequiz','🌅','Коли?','Дні, пори року, частини доби'],['forms','🏛️','Форми назв місць','Порівнюйте назву, напрямок і місце'],['route','🚌','Мій маршрут','Звідки, куди та до кого'],['vocative','👋','Як звернутися?','Pone, Jurgi, Egle, Vytautai'],['planner','🗓️','Мій план дня','День + час + дія + місце'],['build','🧩','Складіть речення','20 речень для практики'],['match','🔗','Доберіть пари','5 слів і 5 перекладів'],['dialog','💬','Читаємо діалоги','Перевіряйте розуміння без припущень'],['final','🏆','Підсумковий тест',`${TOTAL_MODULES*3} завдань · усі ${TOTAL_MODULES} блоків`]];return `<div class="screen-title"><div class="eyebrow">Маленькі кроки, помітний прогрес</div><h1>Тренуйся по-своєму</h1><p class="muted small" style="margin-top:9px">${DATA.questions.length} завдань у банку уроку</p></div><div class="training-grid">${opts.map(([id,icon,t,d])=>`<button class="training-card" data-action="training" data-id="${id}"><span class="pic">${icon}</span><span><h3>${t}</h3><p>${d}</p></span><span class="chevron">›</span></button>`).join('')}</div>`}
function pick(pool,n){const errors=pool.filter(q=>state.mistakes[q.id]),unseen=pool.filter(q=>!state.qstats[q.id]&&!state.mistakes[q.id]),other=pool.filter(q=>state.qstats[q.id]&&!state.mistakes[q.id]);return[...rnd(errors),...rnd(unseen),...rnd(other)].slice(0,n)}
function start(kind,extra){let qs=[],title='',moduleId=null;
if(kind==='module'){moduleId=currentModule;qs=pick(DATA.questions.filter(q=>q.m===currentModule),12);title=moduleFor(currentModule).title;state.lastModule=currentModule}
else if(kind==='final'){qs=rnd(DATA.modules.flatMap(m=>rnd(DATA.questions.filter(q=>q.m===m.id)).slice(0,3)));title='Підсумковий тест'}
else if(kind==='prepositions'){qs=pick(DATA.questions.filter(q=>q.m===1&&q.source),12);title='Į, pas, prie'}
else if(kind==='verbquiz'){qs=pick(DATA.questions.filter(q=>q.m===2),12);title='Теперішній час дієслів'}
else if(kind==='timequiz'){qs=pick(DATA.questions.filter(q=>[3,4,5].includes(q.m)),12);title='Коли? Дні та час'}
else if(kind==='vocative'){qs=pick(DATA.questions.filter(q=>q.m===8),12);title='Кличний відмінок'}
else if(kind==='formsquiz'){qs=pick(DATA.questions.filter(q=>q.m===6),12);title='Форми назв місць'}
else if(kind==='build'){qs=rnd(DATA.questions.filter(q=>q.type==='build')).slice(0,10);title='Складіть речення'}
else if(kind==='mistakes'){qs=rnd(DATA.questions.filter(q=>state.mistakes[q.id])).slice(0,15);title='Повторення помилок'}
else if(kind==='due'){const ids=new Set(Object.entries(state.srs).filter(([id,s])=>s.due<=Date.now()).map(([id])=>id));qs=pick(DATA.questions.filter(q=>ids.has(q.card)),15);title='Час повторити'}
else if(kind==='dialog'){qs=rnd(DATA.questions.filter(q=>q.reading===Number(extra)));title=DATA.dialogs[Number(extra)].title}
else{qs=rnd(DATA.modules.flatMap(m=>rnd(DATA.questions.filter(q=>q.m===m.id)).slice(0,2))).slice(0,12);title='Змішане тренування'}
if(!qs.length){toast('Зараз у цій добірці немає завдань.');return}
session={kind,title,moduleId,questions:qs.map(q=>({q,retry:false})),index:0,baseTotal:qs.length,firstCorrect:0,xpStart:state.xp,wrong:new Set(),retries:new Set(),answered:false,choice:null,input:'',selectedTokens:[],options:[],finished:false};view='quiz';save();render();window.scrollTo({top:0,behavior:'instant'})}
function prepareQuestion(){if(!session)return;const q=session.questions[session.index].q;if(session.preparedId===session.index)return;session.preparedId=session.index;session.answered=false;session.choice=null;session.input='';session.selectedTokens=[];session.options=q.options?rnd(q.options):[];session.tokens=q.type==='build'?rnd(q.answer.split(/\s+/).map((word,id)=>({word,id}))):[]}
function quizScreen(){prepareQuestion();const s=session,item=s.questions[s.index],q=item.q;let input='';if(q.type==='mc'){input=`<div class="choices">${s.options.map((opt,i)=>`<button class="option ${s.choice===i?'selected':''} ${s.answered&&opt===q.answer?'correct':''} ${s.answered&&s.choice===i&&!s.lastCorrect?'wrong':''}" data-action="choice" data-id="${i}" ${s.answered?'disabled':''}><span class="key">${i+1}</span><span>${e(opt)}</span></button>`).join('')}</div>`}else if(q.type==='text'){input=`<label class="sr-only" for="answer-input">Ваша відповідь литовською</label><input id="answer-input" lang="lt" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Напишіть литовською…" value="${e(s.input)}" ${s.answered?'disabled':''}><div class="keyboard" aria-label="Литовські літери">${'ąčęėįšųūž'.split('').map(c=>`<button data-action="letter" data-id="${c}" ${s.answered?'disabled':''}>${c}</button>`).join('')}</div><p class="small muted">Регістр і кінцева пунктуація не впливають на оцінку.</p>`}else{input=`<p class="muted small">Натискайте на слова. Прийменник та залежне слово тримайте разом.</p><div class="tokens answer-area" aria-label="Складене речення">${s.selectedTokens.map((id,i)=>{const t=s.tokens.find(t=>t.id===id);return`<button class="token" data-action="remove-token" data-id="${i}" ${s.answered?'disabled':''}>${e(t.word)}</button>`}).join('')}${!s.selectedTokens.length?'<span class="muted small">Тут з’явиться ваше речення</span>':''}</div><div class="tokens" aria-label="Слова для речення">${s.tokens.map(t=>`<button class="token ${s.selectedTokens.includes(t.id)?'used':''}" data-action="token" data-id="${t.id}" ${s.answered||s.selectedTokens.includes(t.id)?'disabled':''}>${e(t.word)}</button>`).join('')}</div>`}
return`<div class="quiz-top"><button class="back" data-action="quit" aria-label="Вийти з тренування">×</button><div class="progress-line"><span style="width:${s.index/s.questions.length*100}%"></span></div><span class="quiz-step">${s.index+1} / ${s.questions.length}</span></div><p class="muted small">${e(s.title)}</p><div class="quiz-label">${item.retry?'↻ Закріплення помилки':q.type==='text'?'Напишіть відповідь':q.type==='build'?'Складіть речення':'Оберіть відповідь'}</div>${q.reading!==undefined?readingBlock(q.reading):''}<h1 class="question">${e(q.prompt)}</h1>${input}${s.answered?feedback(q):`<button id="check-answer" class="primary full gap" data-action="check" ${canCheck()?'':'disabled'}>Перевірити</button>`}`}
function readingBlock(i){const d=DATA.dialogs[i];return`<details class="reading" open><summary style="padding:0;background:transparent;min-height:30px">${d.title} · текст</summary><div style="padding:12px 0 0">${d.lines.map(line=>`<p lang="lt">${e(line[0])}</p>`).join('')}</div></details>`}
function canCheck(){if(!session)return false;const q=session.questions[session.index].q;return q.type==='mc'?session.choice!==null:q.type==='text'?session.input.trim().length>0:session.selectedTokens.length===session.tokens.length}
function feedback(q){const s=session;return`<div class="feedback ${s.lastCorrect?'':'wrong'}" role="status"><h3>${s.lastCorrect?'✓ Так тримати!':s.near?'Майже! Зверніть увагу на літери.':'Ще трохи практики — і вийде!'}</h3>${!s.lastCorrect||q.type==='build'?`<p class="answer" lang="lt">${e(q.answer)}</p>`:''}<p>${e(q.explain)}</p>${q.speak?`<button class="chip gap" data-action="speak-answer">♪ Послухати відповідь</button>`:''}<button class="primary full" data-action="next">${s.index+1>=s.questions.length?'Показати результат':'Далі →'}</button></div>`}
function checkAnswer(){if(!session||session.answered||!canCheck())return;const s=session,item=s.questions[s.index],q=item.q;let answer=q.type==='mc'?s.options[s.choice]:q.type==='text'?s.input:s.selectedTokens.map(id=>s.tokens.find(t=>t.id===id).word).join(' ');const targets=[q.answer,...(q.accepted||[])];let ok=targets.some(a=>norm(answer)===norm(a));s.near=!ok&&targets.some(a=>fold(answer)===fold(a));
 if(q.type==='text'&&!state.strict&&s.near)ok=true;
 if(q.type==='build'&&!ok){const groupOK=(q.groups||[]).every(g=>(' '+norm(answer)+' ').includes(' '+norm(g)+' '));const tokensOK=norm(answer).split(' ').sort().join('|')===norm(q.answer).split(' ').sort().join('|');ok=groupOK&&tokensOK}
 s.answered=true;s.lastCorrect=ok;
 if(!item.retry&&ok)s.firstCorrect++;
 const qs=state.qstats[q.id]||{attempts:0,correct:0,last:0};qs.attempts++;if(ok)qs.correct++;qs.last=Date.now();state.qstats[q.id]=qs;
 if(ok){delete state.mistakes[q.id];if(q.card)scheduleCard(q.card,true)}else{state.mistakes[q.id]={fails:(state.mistakes[q.id]?.fails||0)+1,nextAt:Date.now()};if(q.card)scheduleCard(q.card,false);s.wrong.add(q.id);if(s.kind!=='final'&&!item.retry&&!s.retries.has(q.id)){s.questions.push({q,retry:true});s.retries.add(q.id)}}
 touch(ok,item.retry?(ok?3:1):(ok?10:2));render();const f=document.querySelector('.feedback');if(f)f.scrollIntoView({block:'nearest',behavior:'smooth'})
}
function nextQuestion(){if(!session?.answered)return;session.index++;if(session.index>=session.questions.length){finish();return}render();window.scrollTo({top:0,behavior:'instant'})}
function finish(){const s=session;s.finished=true;s.percent=Math.round(s.firstCorrect/s.baseTotal*100);s.earned=state.xp-s.xpStart;if(s.moduleId)state.best[s.moduleId]=Math.max(state.best[s.moduleId]||0,s.percent);if(s.kind==='final')state.best.final=Math.max(state.best.final||0,s.percent);save();view='result';render();window.scrollTo({top:0,behavior:'instant'})}
function resultScreen(){if(!session)return home();const s=session,pass=s.percent>=80;return`<section class="result"><div class="medal">${pass?'🏆':'🌱'}</div><div class="eyebrow">${s.kind==='final'?'Тест завершено':'Тренування завершено'}</div><h1 class="gap">${pass?'Чудова робота!':'Крок уперед зроблено!'}</h1><p>${e(s.title)}</p><div class="score-grid"><div class="score-cell"><strong>${s.percent}%</strong><small>точність</small></div><div class="score-cell"><strong>${s.firstCorrect}/${s.baseTotal}</strong><small>з 1-ї спроби</small></div><div class="score-cell"><strong>+${s.earned}</strong><small>балів XP</small></div></div>${s.moduleId?`<div class="${pass?'info-box':'note'}">${pass?'Блок зараховано. Можна переходити до наступного.':'Для зарахування блоку потрібно 80% у серії. Поверніться до пояснень і спробуйте ще раз.'}</div>`:''}${s.wrong.size?`<p class="small">Складних завдань у серії: ${s.wrong.size}. ${s.kind==='final'?'Вони збережені у повторенні.':'Повторні спроби не змінюють результат першої спроби.'}</p>`:'<p>Жодної помилки в цій серії. Нехай слова трохи відпочинуть до наступного повторення.</p>'}<button class="primary full gap" data-action="result-next">${s.moduleId&&s.moduleId<TOTAL_MODULES?'До наступного блоку →':'До навчального шляху'}</button><button class="outline full gap" data-action="restart">Повторити серію</button><button class="chip full gap" data-action="nav" data-id="review">Відкрити повторення</button></section>`}
function dueCards(){return DATA.cards.filter(c=>state.srs[c.id]&&state.srs[c.id].due<=Date.now())}

function availableVoices(){return window.speechSynthesis?window.speechSynthesis.getVoices().filter(v=>/^lt(?:-|_|$)/i.test(v.lang)):[]}
function speak(text){if(!window.speechSynthesis||typeof SpeechSynthesisUtterance==='undefined'){toast('Цей браузер не підтримує озвучення. Скористайтеся посиланнями в профілі.');return}const voices=availableVoices();if(!voices.length){toast('Литовського голосу немає. Додайте його в налаштуваннях пристрою або відкрийте розмовник у профілі.');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[—]/g,''));u.lang='lt-LT';u.voice=voices[0];u.rate=state.rate;u.onerror=()=>toast('Не вдалося озвучити. Перевірте голос і з’єднання.');window.speechSynthesis.speak(u)}

function updateRoute(){const kind=$('route-kind')?.value;if(!kind)return;const pool=['visit','host'].includes(kind)?DATA.people:kind==='go'?[...DATA.named,...DATA.places.filter(c=>!['stalas','kompiuteris','tiltas','ežeras','upė','jūra'].includes(c.n))]:DATA.cities;const select=$('route-word');if(lastRouteKind!==kind||!select.options.length){const prev=select.value;select.innerHTML=pool.map(c=>`<option value="${c.id}">${e(c.n)} — ${e(c.u)}</option>`).join('');if(pool.some(c=>c.id===prev))select.value=prev;else if(kind==='drive')select.value=DATA.cities[1].id;lastRouteKind=kind}const c=cardMap[select.value],from=cardMap[$('route-from').value];if(!c)return;const index=Number($('route-person').value||0),sub=['Aš','Tu','Jis','Mes','Jūs','Jie'][index];$('route-from-wrap').classList.toggle('hide',kind!=='drive');const verb=DATA.verbs.find(v=>v.n===(kind==='drive'?'važiuoti':['live','host'].includes(kind)?'gyventi':'eiti'));let ending='',desc='';if(kind==='drive'){if(!from)return;ending=`iš ${from.g} į ${c.a}`;desc='Iš + родовий; į + знахідний.'}else if(kind==='go'){ending=`į ${c.a}`;desc='До місця: į + знахідний.'}else if(kind==='live'){ending=c.l;desc='Місце проживання: місцевий без прийменника.'}else{ending=`pas ${c.a}`;desc=kind==='host'?'У людини: pas + знахідний.':'До людини: pas + знахідний.'}const sentence=`${sub} ${verb.present[index]} ${ending}.`;$('route-result').dataset.speech=sentence;$('route-result').innerHTML=`<h2 lang="lt">${e(sentence)}</h2><p>${desc}</p><p>Дієслово: <b lang="lt">${e(verb.n)}</b>. Місце / людина: ${e(c.u)}.</p><button class="secondary full" data-action="speak-route">♪ Послухати</button>`}

function startMatch(){const pool=DATA.cards.filter(c=>['Дієслова','Календар','Прислівники','Місця'].includes(c.cat));const cards=rnd(pool).slice(0,5);match={cards,left:rnd(cards),right:rnd(cards),selectedLeft:null,selectedRight:null,matched:new Set(),tries:0,errors:0,finished:false,startXP:state.xp,wrongIds:[]};view='match';render();window.scrollTo({top:0,behavior:'instant'})}
function matchScreen(){const m=match;if(!m)return trainScreen();if(m.finished)return`<section class="result"><div class="medal">🔗</div><h1>Усі пари знайдено!</h1><div class="score-grid"><div class="score-cell"><strong>5</strong><small>пар</small></div><div class="score-cell"><strong>${m.errors}</strong><small>помилок</small></div><div class="score-cell"><strong>+${state.xp-m.startXP}</strong><small>XP</small></div></div><button class="primary full" data-action="new-match">Ще 5 пар</button><button class="outline full gap" data-action="nav" data-id="train">До тренажерів</button></section>`;return`<div class="quiz-top"><button class="back" data-action="quit" aria-label="Вийти">×</button><div class="progress-line"><span style="width:${m.matched.size/5*100}%"></span></div><span class="quiz-step">${m.matched.size} / 5</span></div><h1 class="question">З’єднайте слово<br>та його переклад</h1><p class="small muted" style="margin-bottom:20px">Спочатку оберіть литовське слово, потім український відповідник.</p><div class="match-board">${['left','right'].map(side=>`<div class="match-col">${m[side].map(c=>`<button class="match-tile ${m.matched.has(c.id)?'matched':''} ${m[side==='left'?'selectedLeft':'selectedRight']===c.id?'selected':''} ${m.wrongIds.includes(side+':'+c.id)?'mismatch':''}" data-action="match-tile" data-side="${side}" data-id="${c.id}" ${m.matched.has(c.id)?'disabled':''} ${side==='left'?'lang="lt"':''}>${e(side==='left'?c.n:c.u)}</button>`).join('')}</div>`).join('')}</div><p class="help-footer">Правильні пари залишаються видимими. Можна змінити вибір до перевірки другої картки.</p>`}
function matchTile(side,id){const m=match;if(!m||m.finished||m.matched.has(id))return;m.wrongIds=[];if(side==='left')m.selectedLeft=id;else m.selectedRight=id;if(m.selectedLeft&&m.selectedRight){m.tries++;const ok=m.selectedLeft===m.selectedRight;if(ok){m.matched.add(m.selectedLeft);scheduleCard(m.selectedLeft,true);touch(true,5)}else{m.errors++;m.wrongIds=['left:'+m.selectedLeft,'right:'+m.selectedRight];scheduleCard(m.selectedLeft,false);touch(false,1)}m.selectedLeft=null;m.selectedRight=null;if(m.matched.size===5)m.finished=true}render()}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function pad2(n){return String(n).padStart(2,'0')}
function icsLocal(d){return`${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`}
function icsUTC(d){return`${d.getUTCFullYear()}${pad2(d.getUTCMonth()+1)}${pad2(d.getUTCDate())}T${pad2(d.getUTCHours())}${pad2(d.getUTCMinutes())}${pad2(d.getUTCSeconds())}Z`}
function icsEscape(s){return s.replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function foldICS(lines){const enc=new TextEncoder();return lines.flatMap(line=>{let parts=[],cur='';for(const ch of line){if(enc.encode(cur+ch).length>73){parts.push(cur);cur=' '+ch}else cur+=ch}parts.push(cur);return parts}).join('\r\n')+'\r\n'}
function calendarText(plan=false,now=new Date()){let base=new Date(now);const [h,m]=state.reminderTime.split(':').map(Number);base.setHours(h,m,0,0);if(base<=now)base.setDate(base.getDate()+1);const stamp=icsUTC(now),uid=`${now.getTime()}-${Math.random().toString(36).slice(2,9)}`;let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Labas//Lithuanian Lesson 5//UK','CALSCALE:GREGORIAN','METHOD:PUBLISH'];const offsets=plan?[1,3,7,14]:[0];for(const offset of offsets){let d=new Date(base);if(plan){d=new Date(now);d.setDate(d.getDate()+offset);d.setHours(h,m,0,0)}const end=new Date(d.getTime()+10*60000);lines.push('BEGIN:VEVENT',`UID:${uid}-${offset}@labas-lesson5.local`,`DTSTAMP:${stamp}`,`DTSTART:${icsLocal(d)}`,`DTEND:${icsLocal(end)}`,'SUMMARY:'+icsEscape(plan?`Литовська · Урок 5 · повторення через ${offset} дн.`:'Литовська · Урок 5 · 10 хвилин практики'),'DESCRIPTION:'+icsEscape('Відкрийте свій index.html уроку 5. Повторіть картки\nта виконайте коротку серію вправ із дієслів, часу й маршрутів.'));if(!plan)lines.push('RRULE:FREQ=DAILY');lines.push('BEGIN:VALARM','TRIGGER:-PT5M','ACTION:DISPLAY','DESCRIPTION:'+icsEscape('Час повторити литовську · Урок 5'),'END:VALARM','END:VEVENT')}lines.push('END:VCALENDAR');return foldICS(lines)}
function exportProgress(){download('labas-lesson5-progress.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json;charset=utf-8');toast('Копію прогресу підготовлено. Збережіть завантажений файл.')}
async function importProgress(file){if(!file)return;if(file.size>3000000){toast('Файл завеликий для копії прогресу.');return}try{const text=await file.text(),candidate=sanitize(JSON.parse(text));showModal('Відновити прогрес?','Поточний прогрес уроку 5 буде замінено даними цієї копії. Інші уроки не змінюються.','Відновити',()=>{state=candidate;save();view='profile';render();toast('Прогрес уроку 5 відновлено.')})}catch(err){toast('Не вдалося прочитати копію: '+err.message)}}
let pendingModalAction=null;
function showModal(title,text,label,callback){pendingModalAction=callback;$('modal').className='quit-layer';$('modal').innerHTML=`<div class="quit-box" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">${e(title)}</h2><p>${e(text)}</p><button id="modal-confirm" class="primary full" data-action="modal-confirm">${e(label)}</button><button class="outline full gap" data-action="modal-cancel">Скасувати</button></div>`;setTimeout(()=>$('modal-confirm')?.focus(),0)}
function closeModal(){ $('modal').className='hide';$('modal').innerHTML='';pendingModalAction=null}
function askQuit(callback=()=>go('train',true)){showModal('Завершити тренування?','Уже нараховані бали й відповіді збережено. Підсумок цієї серії не буде зараховано.','Вийти',callback)}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;
 switch(a){
 case'nav':if(id==='cards'&&flashIndex>=flashDeck.length)beginCards();go(id);break;
 case'open-module':currentModule=Number(id);moduleTab='learn';go('module');break;
 case'module-tab':moduleTab=id;render();break;
 case'start':start(id);break;
 case'training':if(id==='match')startMatch();else if(['forms','route','dialog','verbs','planner'].includes(id)){lastRouteKind='';go(id)}else start(id);break;
 case'speak-card':speak(cardMap[id].n);break;
 case'flip':flashFlipped=!flashFlipped;render();break;
 case'card-mode':dictMode=id==='dict';render();break;
 case'card-cat':flashCat=id;beginCards();render();break;
 case'reverse':flashReverse=!flashReverse;flashFlipped=false;render();break;
 case'reshuffle':beginCards();render();break;
 case'rate-card':rateCard(id==='1');break;
 case'skip-card':flashIndex++;flashFlipped=false;render();break;
 case'choice':if(session&&!session.answered){session.choice=Number(id);render()}break;
 case'check':checkAnswer();break;
 case'next':nextQuestion();break;
 case'letter':{const input=$('answer-input');if(!input||session?.answered)break;const start=input.selectionStart??input.value.length,end=input.selectionEnd??start;input.value=input.value.slice(0,start)+id+input.value.slice(end);session.input=input.value;input.focus();input.setSelectionRange(start+id.length,start+id.length);$('check-answer').disabled=!canCheck();break}
 case'token':if(session&&!session.answered&&!session.selectedTokens.includes(Number(id))){session.selectedTokens.push(Number(id));render()}break;
 case'remove-token':if(session&&!session.answered){session.selectedTokens.splice(Number(id),1);render()}break;
 case'speak-answer':speak(session.questions[session.index].q.speak);break;
 case'quit':askQuit();break;
 case'restart':{const kind=session.kind,mid=session.moduleId,reading=session.questions[0].q.reading;if(mid)currentModule=mid;start(kind,reading);break}
 case'result-next':if(session?.moduleId&&session.moduleId<TOTAL_MODULES){currentModule=session.moduleId+1;moduleTab='learn';go('module',true)}else go('home',true);break;
 case'due-flash':flashDeck=rnd(dueCards());flashCat='Усі';flashIndex=0;flashFlipped=false;flashRated=0;dictMode=false;view='cards';render();break;
 case'calendar':case'calendar-week':download(a==='calendar'?'lithuanian-lesson5-daily.ics':'lithuanian-lesson5-review.ics',calendarText(a==='calendar-week'),'text/calendar;charset=utf-8');toast('Відкрийте .ics у календарі та підтвердьте імпорт.');break;
 case'export':exportProgress();break;
 case'import':$('file-import').value='';$('file-import').click();break;
 case'voice-test':speak('Kaip sekasi? Gerai, ačiū.');break;
 case'reset':showModal('Скинути урок 5?','Це видалить бали, результати, картки та список помилок лише цього уроку. Збережіть резервну копію, якщо хочете повернутися до прогресу.','Скинути прогрес',()=>{state=fresh();flashDeck=[];save();go('home',true);toast('Прогрес уроку 5 скинуто.')});break;
 case'modal-cancel':closeModal();break;
 case'modal-confirm':{const cb=pendingModalAction;closeModal();if(cb)cb();break}
 case'forms-quiz':start('formsquiz');break;
 case'speak-forms':{const c=cardMap[$('form-word').value];speak([c.n,c.a,c.g,c.l].join('. '));break}
 case'speak-route':speak($('route-result').dataset.speech);break;case'speak-verb':{const v=DATA.verbs.find(v=>v.id===$('verb-word').value);speak(v.present.join('. '));break}case'verb-quiz':start('verbquiz');break;case'speak-plan':speak($('plan-result').dataset.speech);break;case'time-quiz':start('timequiz');break;
 case'dialog':go('dialog');setTimeout(()=>document.querySelectorAll('#main>.card')[Number(id)]?.scrollIntoView({block:'start',behavior:'smooth'}),0);break;
 case'start-dialog':start('dialog',Number(id));break;
 case'speak-line':{const[i,j]=id.split(',').map(Number);speak(DATA.dialogs[i].lines[j][0]);break}
 case'new-match':startMatch();break;
 case'match-tile':matchTile(b.dataset.side,id);break;
 }
});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='answer-input'&&session){session.input=el.value;const btn=$('check-answer');if(btn)btn.disabled=!canCheck()}if(el.id==='dict-search'){searchText=el.value;const q=fold(searchText);const list=DATA.cards.filter(c=>(flashCat==='Усі'||c.cat===flashCat)&&(!q||fold(c.n+' '+c.u).includes(q)));$('dict-results').innerHTML=dictionary(list);$('dict-count').textContent=list.length+' слів / фраз'}});
document.addEventListener('change',event=>{const el=event.target;switch(el.id){case'daily-goal':state.dailyGoal=Number(el.value);save();break;case'reminder-time':if(/^([01]\d|2[0-3]):[0-5]\d$/.test(el.value)){state.reminderTime=el.value;save()}break;case'voice-rate':state.rate=Number(el.value);save();break;case'strict-mode':state.strict=el.checked;save();break;case'file-import':importProgress(el.files[0]);break;case'form-word':updateForms();break;case'verb-word':updateVerbs();break;case'plan-person':case'plan-day':case'plan-time':case'plan-action':case'plan-place':updatePlan();break;case'route-kind':case'route-word':case'route-person':case'route-from':updateRoute();break}});
document.addEventListener('keydown',event=>{if(!$('modal').classList.contains('hide')){if(event.key==='Escape')closeModal();if(event.key==='Tab'){const bs=$('modal').querySelectorAll('button');if(event.shiftKey&&document.activeElement===bs[0]){event.preventDefault();bs[bs.length-1].focus()}else if(!event.shiftKey&&document.activeElement===bs[bs.length-1]){event.preventDefault();bs[0].focus()}}return}if(view!=='quiz'||!session)return;const q=session.questions[session.index].q;if(event.key==='Enter'){if(session.answered)nextQuestion();else checkAnswer();event.preventDefault()}else if(q.type==='mc'&&!session.answered&&['1','2','3','4'].includes(event.key)){const i=Number(event.key)-1;if(i<session.options.length){session.choice=i;render()}}});
if(window.speechSynthesis){window.speechSynthesis.addEventListener?.('voiceschanged',()=>{if(view==='profile'){const v=availableVoices();if($('voice-status'))$('voice-status').textContent=v.length?'Знайдено литовський голос: '+v[0].name:'Литовського голосу не знайдено. Додайте його в налаштуваннях пристрою.'}});window.speechSynthesis.getVoices()}
window.addEventListener('pageshow',()=>{updateHeader()});
function verbsScreen(){return `<div class="screen-title row"><button class="back" data-action="nav" data-id="train" aria-label="До тренажерів">‹</button><div><div class="eyebrow">Від початкової форми до речення</div><h1>Таблиці дієслів</h1></div></div><div class="card"><label class="form-label" for="verb-word">Дієслово</label><select id="verb-word">${DATA.verbs.map(v=>`<option value="${v.id}">${e(v.n)} — ${e(v.u)}${v.review?' · повторення':''}</option>`).join('')}</select><div id="verb-result"></div><button class="secondary full" data-action="speak-verb">♪ Послухати теперішні форми</button></div><div class="info-box gap">У таблиці теперішнього часу форми третьої особи однини й множини однакові. Минулий час тут показано лише як одну з трьох основних форм.</div><button class="primary full gap" data-action="verb-quiz">Перевірити дієслова</button>`}
function updateVerbs(){const v=DATA.verbs.find(v=>v.id===$('verb-word')?.value);if(!v)return;$('verb-result').innerHTML=`<div class="form-result"><h2 lang="lt">${e(v.n)}</h2><p lang="lt">${e(v.n)}, ${e(v.present[2])}, ${e(v.past)}</p></div>${table(['Хто?','Теперішня форма'],DATA.pronouns.map((p,i)=>[lt(p),lt(v.present[i])]))}`}
const PLAN_ACTIONS=[['eiti','Іти до місця'],['važiuoti','Їхати до міста / країни'],['susitikti','Зустрітися біля місця'],['dirbti','Працювати в закладі'],['skambinti','Телефонувати мамі'],['atostogauti','Відпочивати біля моря']];
let lastPlanAction='';
function plannerScreen(){return `<div class="screen-title row"><button class="back" data-action="nav" data-id="train" aria-label="До тренажерів">‹</button><div><div class="eyebrow">Ваше речення литовською</div><h1>Мій план дня</h1></div></div><div class="card"><label class="form-label" for="plan-person">Хто?</label><select id="plan-person">${['Aš — я','Tu — ти','Jis — він','Mes — ми','Jūs — ви','Jie — вони'].map((p,i)=>`<option value="${i}">${p}</option>`).join('')}</select><label class="form-label" for="plan-day">У який день?</label><select id="plan-day">${DATA.timewords.filter(c=>['weekday','weekend'].includes(c.group)).map(c=>`<option value="${c.id}">${e(c.u)} → ${e(c.a)}</option>`).join('')}</select><label class="form-label" for="plan-time">Частина доби</label><select id="plan-time"><option value="rytą">уранці · rytą</option><option value="dieną">удень · dieną</option><option value="vakare">увечері · vakare</option><option value="naktį">уночі · naktį</option><option value="">не уточнювати</option></select><label class="form-label" for="plan-action">Дія</label><select id="plan-action">${PLAN_ACTIONS.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select><div id="plan-place-wrap"><label class="form-label" for="plan-place">Місце</label><select id="plan-place"></select></div><div class="form-result" id="plan-result"></div></div><div class="note gap">Це тренажер мовних форм. Він не створює подію у календарі. Нагадування про навчання можна додати в профілі.</div><button class="primary full gap" data-action="time-quiz">Перевірити час і дні</button>`}
function updatePlan(){const action=$('plan-action')?.value;if(!action)return;const pool=action==='važiuoti'?DATA.cities:action==='susitikti'?[...DATA.named,...DATA.places.filter(c=>!['kompiuteris','stalas','susitikimas'].includes(c.n))]:action==='dirbti'?[...DATA.named.filter(c=>!['Neries upė','Kauno senamiestis','Parko gatvė','Turgaus aikštė','Daukanto aikštė','Antakalnio gatvė','Teatro gatvė','Gedimino prospektas'].includes(c.n)),...DATA.places.filter(c=>['universitetas','bankas','ambasada','kavinė','biblioteka','mokykla'].includes(c.n))]:[...DATA.named,...DATA.places.filter(c=>!['upė','jūra','ežeras','tiltas','stalas','kompiuteris','susitikimas','gatvė','aikštė','stotelė'].includes(c.n))];const select=$('plan-place');if(lastPlanAction!==action||!select.options.length){const prev=select.value;select.innerHTML=pool.map(c=>`<option value="${c.id}">${e(c.n)} — ${e(c.u)}</option>`).join('');if(pool.some(c=>c.id===prev))select.value=prev;lastPlanAction=action}const index=Number($('plan-person').value||0),c=cardMap[select.value],day=cardMap[$('plan-day').value];if(!day)return;const part=$('plan-time').value||'',sub=['aš','tu','jis','mes','jūs','jie'][index],v=DATA.verbs.find(v=>v.n===action);if(!v||(!c&&!['skambinti','atostogauti'].includes(action)))return;let ending=action==='skambinti'?'mamai':action==='atostogauti'?'prie jūros':action==='susitikti'?'prie '+c.g:action==='dirbti'?c.l:'į '+c.a;const time=day.a+(part?' '+part:'');const sentence=time[0].toUpperCase()+time.slice(1)+' '+sub+' '+v.present[index]+' '+ending+'.';$('plan-place-wrap').classList.toggle('hide',['skambinti','atostogauti'].includes(action));$('plan-result').dataset.speech=sentence;$('plan-result').innerHTML=`<h2 lang="lt">${e(sentence)}</h2><p>Час: ${e(day.when)}${part?' · '+e(byN[part]?.u||part):''}.</p><p>Дія: ${e(v.uk[index])}. ${['skambinti','atostogauti'].includes(action)?'':`Місце: ${e(c.u)}.`}</p><button class="secondary full" data-action="speak-plan">♪ Послухати</button>`}


render();
</script>
</body>
